<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a1730"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Compteur Fléchettes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;600;700&display=swap">
<style>
/* Layout : habillage « retransmission TV » — bandeaux de score biseautés, joueur au lancer en jaune ; cible à gauche, tableau à droite, empilé sur téléphone */
:root{--bg:#0a1730;--band:#11244a;--band2:#183261;--line:#24407a;--fg:#f4f6fb;--mut:#93a3c4;--hl:#ffd23f;--ink:#0a1730;--red:#e63946;--green:#2fbf71;--blue:#4ea8ff;
--disp:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--body:Barlow,system-ui,sans-serif;color-scheme:dark}
html,body{height:100%}
html,button,.board{touch-action:manipulation}
body{background:var(--bg);background-image:linear-gradient(180deg,#0d1d3d 0,var(--bg) 320px);color:var(--fg);font-family:var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
button:active{transform:translateY(1px)}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:100%}
.disp{font-family:var(--disp);font-weight:900;line-height:.95;letter-spacing:.01em}
h2{font-family:var(--disp);font-weight:800;font-size:1.5rem;margin:6px 0 0;color:var(--mut)}
.hint{color:var(--mut);font-size:.9rem}
.msg{color:var(--red);font-weight:700;min-height:1.2em}
input{font:inherit;font-weight:600;background:var(--band);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:10px 12px;min-width:0;flex:1}

/* En-tête du menu */
.brand{display:flex;align-items:center;gap:14px;padding-block:6px 4px}
.brand canvas{width:56px;height:56px;flex:none}
.brand .disp{font-size:clamp(2.4rem,7vw,3.6rem);text-transform:uppercase}
.brand .disp span{color:var(--hl)}

/* Choix du jeu */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.mode{background:var(--band);border:1px solid var(--line);border-radius:4px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.mode b{font-family:var(--disp);font-weight:900;font-size:2.2rem;line-height:1}
.mode small{color:var(--mut);font-size:.85rem;line-height:1.3}
.mode.on{background:var(--hl);border-color:var(--hl);color:var(--ink)}
.mode.on small{color:#3d4a66}

/* Règles en interrupteurs */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.opt{display:flex;align-items:center;gap:12px;background:var(--band);border:1px solid var(--line);border-radius:4px;padding:10px 12px;text-align:left;min-width:0}
.opt span{flex:1;min-width:0}
.opt b{display:block;font-weight:700}
.opt small{color:var(--mut);font-size:.82rem}
.sw{width:46px;height:26px;border-radius:13px;background:#2b3c63;position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--fg);transition:transform .15s}
.opt[aria-checked="true"] .sw{background:var(--green)}
.opt[aria-checked="true"] .sw::after{transform:translateX(20px)}

/* Joueurs */
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;gap:6px;align-items:center}
.ico{width:44px;height:44px;flex:none;background:var(--band);border:1px solid var(--line);border-radius:4px;font-weight:700}
.tm{width:44px;height:44px;flex:none;border-radius:4px;font-family:var(--disp);font-weight:900;font-size:1.5rem;color:var(--ink)}
.t0{background:var(--red)}.t1{background:var(--green)}.t2{background:var(--hl)}.t3{background:var(--blue)}
.ghost{background:transparent;border:1px dashed var(--line);border-radius:4px;padding:12px;font-weight:700;color:var(--mut)}
.go{background:var(--hl);color:var(--ink);font-family:var(--disp);font-size:1.8rem;font-weight:900;letter-spacing:.02em;padding:12px;border-radius:4px;text-transform:uppercase}
.sec{background:var(--band2);border-radius:4px;padding:12px;font-weight:700}

/* Partie */
.game{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,400px);gap:16px;flex:1;min-height:0;align-items:start}
.side{display:flex;flex-direction:column;gap:10px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;flex-wrap:wrap}
.top .disp{font-size:2.4rem;text-transform:uppercase}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.78rem;font-weight:700;background:var(--band2);color:var(--mut);border-radius:3px;padding:3px 7px}
.round{font-family:var(--disp);font-weight:800;font-size:1.3rem;color:var(--mut)}

/* Bandeaux de score façon TV */
.sbs{display:flex;flex-direction:column;gap:4px}
.sb{display:grid;grid-template-columns:8px minmax(0,1fr) auto;align-items:center;background:var(--band);clip-path:polygon(0 0,100% 0,calc(100% - 16px) 100%,0 100%);padding-right:26px;min-height:64px}
.sb::before{content:"";align-self:stretch;background:var(--line)}
.sb-n{padding:8px 12px;min-width:0}
.sb-n b{display:block;font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-n small{display:flex;gap:12px;color:var(--mut);font-size:.82rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sb-n u{text-decoration:none;color:var(--hl)}
.sb-s{font-family:var(--disp);font-weight:900;font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.sb.on{background:var(--band2)}
.sb.on::before{background:var(--hl)}
.sb.on .sb-s{color:var(--hl)}

.turn{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.who{font-weight:700;margin-right:auto;min-width:0;overflow-wrap:anywhere}
.who small{color:var(--mut);font-weight:400}
.dart{background:var(--band);border-bottom:3px solid var(--line);min-width:60px;padding:6px 8px;text-align:center;font-family:var(--disp);font-size:1.6rem;font-weight:800}
.dart.f{border-color:var(--hl)}
.co{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--green);color:var(--ink);padding:6px 14px;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.co small{font-weight:700}
.co b{font-family:var(--disp);font-weight:900;font-size:1.9rem;letter-spacing:.02em;padding-right:10px}
.ctl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ctl button{background:var(--band);border:1px solid var(--line);border-radius:4px;padding:12px 0;font-weight:700}

/* Clavier */
.pad{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-content:start}
.k{background:var(--band);border:1px solid var(--line);border-radius:4px;padding:12px 0;font-family:var(--disp);font-size:1.9rem;font-weight:800;font-variant-numeric:tabular-nums}
.k.mod{font-family:var(--body);font-size:1rem;font-weight:700}
.k.mod.on{background:var(--hl);color:var(--ink);border-color:var(--hl)}
.k.bull{background:#1f6b45;border-color:#1f6b45}.k.bull2{background:#9e2730;border-color:#9e2730}

.board{display:block;width:100%;max-width:calc(100vh - 40px);max-width:calc(100dvh - 40px);aspect-ratio:1;justify-self:center;cursor:crosshair}

/* Tableaux */
.tbl{overflow-x:auto;background:var(--band);border-radius:4px}
.tbl table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:6px 10px;text-align:center;border-bottom:1px solid var(--line)}
.tbl thead th{font-weight:700;font-size:.9rem;white-space:nowrap;max-width:130px;overflow:hidden;text-overflow:ellipsis;border-bottom:2px solid var(--line)}
.tbl tbody th{text-align:left;white-space:nowrap}
.crt tbody th{font-family:var(--disp);font-size:1.5rem;font-weight:800}
.crt td{font-family:var(--disp);font-size:1.6rem;font-weight:800;line-height:1.1}
.tbl .cur{background:rgba(255,210,63,.1)}
.tbl thead .cur{color:var(--hl);border-bottom-color:var(--hl)}
.crt tr.dead{opacity:.3}
.crt .pts td{color:var(--hl)}
.tbl .mpr th,.tbl .mpr td{font-family:var(--body);font-size:.85rem;font-weight:400;color:var(--mut)}
.stats tbody th{color:var(--mut);font-weight:600;font-size:.9rem}
.stats td{font-family:var(--disp);font-size:1.5rem;font-weight:800}
.stats .w{color:var(--hl)}

/* Victoire */
.win{display:flex;flex-direction:column;gap:14px;padding-block:20px}
.banner{background:var(--hl);color:var(--ink);padding:14px 22px;clip-path:polygon(0 0,100% 0,calc(100% - 24px) 100%,0 100%);animation:in .5s ease-out both}
.banner small{font-weight:700;font-size:1rem}
.banner .disp{font-size:clamp(2.8rem,10vw,5rem);text-transform:uppercase;overflow-wrap:anywhere}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>*{flex:1 1 180px}
@keyframes in{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}

@media (max-width:760px){.game{grid-template-columns:1fr}}
@media (max-width:520px){.pad{grid-template-columns:repeat(5,1fr)}.sb-s{font-size:2.6rem}.top .disp{font-size:2rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap" id="app"></div>

<script>
const $=id=>document.getElementById(id),app=$('app'),KEY='darts2',TEAM='ABCD';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cfg={mode:'x01',start:501,dout:true,bull50:false,teams:false,random:false,input:innerWidth<600?'clavier':'cible',
  players:[{n:'Joueur 1',t:0},{n:'Joueur 2',t:1}]};
let S=null,mult=1,msg='',err='';const hist=[];
try{const d=JSON.parse(localStorage.getItem(KEY));if(d){Object.assign(cfg,d.cfg||{});S=d.S&&d.S.ps?d.S:null}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({cfg,S}))}catch(e){}};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=n=>n.toFixed(1).replace('.',',');
const avg=o=>o.darts?fmt(o.total/o.darts*3):'–';
const MODES=[['301','301','Partie courte'],['501','501','Le classique des pros'],['701','701','Partie longue, idéale à plusieurs'],
  ['cricket','Cricket','Fermer du 15 au 20 et le bull'],['wild','Wildcard','Cricket avec des numéros tirés au sort qui changent']];

// ---------- Menu ----------
function setup(){
  const P=cfg.players,x=cfg.mode=='x01',cur=x?String(cfg.start):cfg.mode;
  const opt=(id,on,t,d)=>`<button class="opt" role="switch" aria-checked="${on}" data-opt="${id}"><span><b>${t}</b><small>${d}</small></span><i class="sw"></i></button>`;
  app.innerHTML=`<header class="brand"><canvas id="logo" width="112" height="112" aria-hidden="true"></canvas><div class="disp">Score <span>Fléchettes</span></div></header>
  <h2>Jeu</h2>
  <div class="modes">${MODES.map(([id,l,d])=>`<button class="mode ${cur==id?'on':''}" data-mode="${id}"><b>${l}</b><small>${d}</small></button>`).join('')}</div>
  <h2>Règles</h2>
  <div class="opts">
  ${x?opt('dout',cfg.dout,'Finir sur un double','Le dernier lancer doit être un double ou le bull'):''}
  ${opt('bull',!cfg.bull50,'Double bull',cfg.bull50?'Tout le bull vaut 50':'25 pour l’anneau, 50 pour le centre')}
  ${opt('teams',cfg.teams,'Jouer en équipes','Les coéquipiers partagent le score')}
  ${opt('rnd',cfg.random,'Ordre aléatoire','L’ordre est tiré au sort au lancement')}
  </div>
  <h2>Joueurs</h2>
  <div class="plist">${P.map((p,i)=>`<div class="prow">
    ${cfg.teams?`<button class="tm t${p.t}" data-team="${i}" aria-label="Équipe ${TEAM[p.t]}, toucher pour changer">${TEAM[p.t]}</button>`:''}
    <input id="n${i}" value="${esc(p.n)}" aria-label="Nom du joueur ${i+1}">
    ${cfg.random?'':`<button class="ico" data-up="${i}" aria-label="Monter">↑</button><button class="ico" data-dn="${i}" aria-label="Descendre">↓</button>`}
    <button class="ico" data-del="${i}" aria-label="Retirer">✕</button></div>`).join('')}</div>
  ${cfg.teams?'<div class="hint">Touche la lettre d’un joueur pour changer son équipe.</div>':''}
  <button class="ghost" id="add">+ Ajouter un joueur</button>
  <div class="msg">${err}</div>
  <button class="go" id="start">Lancer le match</button>
  ${S&&S.winner==null?'<button class="sec" id="resume">Reprendre la partie en cours</button>':''}`;
  drawLogo();
  app.onclick=e=>{const t=e.target.closest('button');if(!t)return;
    P.forEach((p,i)=>{const v=$('n'+i).value.trim();p.n=v||'Joueur '+(i+1)});err='';const d=t.dataset;
    if(d.mode){if(/^\d+$/.test(d.mode)){cfg.mode='x01';cfg.start=+d.mode}else cfg.mode=d.mode}
    else if(d.opt=='dout')cfg.dout=!cfg.dout
    else if(d.opt=='bull')cfg.bull50=!cfg.bull50
    else if(d.opt=='teams')cfg.teams=!cfg.teams
    else if(d.opt=='rnd')cfg.random=!cfg.random
    else if(d.team){const p=P[+d.team];p.t=(p.t+1)%4}
    else if(d.up){const i=+d.up;if(i>0)[P[i-1],P[i]]=[P[i],P[i-1]]}
    else if(d.dn){const i=+d.dn;if(i<P.length-1)[P[i+1],P[i]]=[P[i],P[i+1]]}
    else if(d.del){if(P.length>1)P.splice(+d.del,1)}
    else if(t.id=='add')P.push({n:'Joueur '+(P.length+1),t:P.length%2})
    else if(t.id=='resume'){mult=1;msg='';return game()}
    else if(t.id=='start'){if(startGame())return}
    save();setup();
  };
}
function drawLogo(){const c=$('logo');if(!c)return;const x=c.getContext('2d'),R=56;x.translate(R,R);
  for(let i=0;i<20;i++){const a0=(i-.5)*PI/10-PI/2,a1=a0+PI/10,dk=i%2==0;
    [[1,dk?'#e63946':'#2fbf71'],[.86,dk?'#1d1d1b':'#efe6c8'],[.62,dk?'#e63946':'#2fbf71'],[.5,dk?'#1d1d1b':'#efe6c8']].forEach(([r,col])=>{x.beginPath();x.moveTo(0,0);x.arc(0,0,R*r,a0,a1);x.closePath();x.fillStyle=col;x.fill()})}
  x.beginPath();x.arc(0,0,R*.15,0,7);x.fillStyle='#2fbf71';x.fill();x.beginPath();x.arc(0,0,R*.07,0,7);x.fillStyle='#e63946';x.fill()}

function startGame(){
  const P=cfg.players.map(p=>({...p}));if(cfg.random)shuffle(P);
  let sides;
  if(cfg.teams){const m=new Map();P.forEach(p=>{if(!m.has(p.t))m.set(p.t,[]);m.get(p.t).push(p.n)});
    if(m.size<2){err='Répartis les joueurs dans au moins deux équipes.';return false}
    sides=[...m].map(([t,mem])=>({name:'Équipe '+TEAM[t],members:mem}))}
  else sides=P.map(p=>({name:p.n,members:[p.n]}));
  let nums=[20,19,18,17,16,15];
  if(cfg.mode=='wild')nums=shuffle([...Array(20)].map((_,i)=>i+1)).slice(0,6).sort((a,b)=>b-a);
  if(cfg.mode!='x01')nums.push(25);
  const ps={};P.forEach(p=>ps[p.n]={darts:0,total:0,best:0,t100:0,t140:0,t180:0,co:0,pts:0});
  S={mode:cfg.mode,start:cfg.start,dout:cfg.dout,bull50:cfg.bull50,nums,cur:0,round:1,turn:[],wait:false,winner:null,ps,order:P.map(p=>p.n),
    sides:sides.map(s=>({...s,mi:0,score:cfg.start,pts:0,marks:{},darts:0,total:0,last:''}))};
  hist.length=0;mult=1;msg='';save();game();return true;
}
const thrower=()=>{const s=S.sides[S.cur];return s.members[s.mi%s.members.length]};
const pst=()=>S.ps[thrower()];
function volee(p,n,tot,win){p.darts+=n;p.total+=tot;p.best=Math.max(p.best,tot);
  if(tot==180)p.t180++;else if(tot>=140)p.t140++;else if(tot>=100)p.t100++;if(win)p.co=Math.max(p.co,tot)}

// ---------- Finish conseillé ----------
const SEG=(()=>{const o=[];for(let i=20;i>=1;i--)o.push(['T'+i,3*i,2],['S'+i,i,0],['D'+i,2*i,5]);o.push(['25',25,3],['Bull',50,4]);return o})();
const DR=[20,16,18,12,10,8,14,6,4,2,19,17,15,13,11,9,7,5,3,1];
const dpen=x=>x[0]=='Bull'?6:DR.indexOf(+x[0].slice(1));
function checkout(r,darts,dout){
  if(r<(dout?2:1)||r>(dout?170:180))return'';
  const fin=dout?SEG.filter(x=>x[0][0]=='D'||x[0]=='Bull'):SEG,fp=x=>dout?dpen(x):x[2];
  let best=null,bs=1e9;
  const t=(set,f)=>{const s=set.reduce((a,x)=>a+x[2],0)+fp(f);if(s<bs){bs=s;best=[...set.sort((a,b)=>b[1]-a[1]),f]}};
  for(const f of fin)if(f[1]==r)t([],f);
  if(!best&&darts>1)for(const a of SEG)for(const f of fin)if(a[1]+f[1]==r)t([a],f);
  if(!best&&darts>2)for(const a of SEG)for(const b of SEG)for(const f of fin)if(a[1]+b[1]+f[1]==r)t([a,b],f);
  return best?best.map(x=>x[0]).join(' '):'';
}

// ---------- Cible ----------
const ORDER=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5],PI=Math.PI;
// Proportions élargies (triples et doubles plus épais que sur une vraie cible) pour viser au doigt
const RB=.07,R25=.15,T0=.5,T1=.62,D0=.86,PLAY=.84;
function drawBoard(cv){
  const s=cv.clientWidth;if(!s)return;const d=devicePixelRatio||1;cv.width=cv.height=s*d;
  const c=cv.getContext('2d');c.scale(d,d);const R=s/2,P=R*PLAY;c.translate(R,R);
  const act=S&&S.mode!='x01'?S.nums:null;
  c.fillStyle='#07101f';c.beginPath();c.arc(0,0,R,0,7);c.fill();
  const ring=(r0,r1,col,a0,a1)=>{c.beginPath();c.arc(0,0,r1*P,a0,a1);c.arc(0,0,r0*P,a1,a0,true);c.closePath();c.fillStyle=col;c.fill()};
  c.textAlign='center';c.textBaseline='middle';
  for(let i=0;i<20;i++){const a0=(i-.5)*PI/10-PI/2,a1=a0+PI/10,dk=i%2==0,sc=dk?'#1d1d1b':'#efe6c8',mc=dk?'#d8352c':'#2f9a55';
    ring(R25,T0,sc,a0,a1);ring(T0,T1,mc,a0,a1);ring(T1,D0,sc,a0,a1);ring(D0,1,mc,a0,a1);
    const on=!act||act.includes(ORDER[i]);if(!on)ring(R25,1,'rgba(7,16,31,.74)',a0,a1);
    c.fillStyle=on?'#f4f6fb':'#3b4a6b';c.font=`800 ${R*.13}px "Big Shoulders Display",Impact,sans-serif`;
    const am=a0+PI/20;c.fillText(ORDER[i],Math.cos(am)*R*.92,Math.sin(am)*R*.92)}
  ring(RB,R25,'#2f9a55',0,7);ring(0,RB,'#d8352c',0,7);
  c.strokeStyle='rgba(190,195,205,.55)';c.lineWidth=1;[RB,R25,T0,T1,D0,1].forEach(r=>{c.beginPath();c.arc(0,0,r*P,0,7);c.stroke()});
  (S&&S.turn||[]).forEach((t,k)=>{if(t.x==null)return;c.beginPath();c.arc(t.x*P,t.y*P,R*.04,0,7);c.fillStyle='#ffd23f';c.fill();c.lineWidth=3;c.strokeStyle='#0a1730';c.stroke();
    c.fillStyle='#0a1730';c.font=`800 ${R*.05}px Barlow,sans-serif`;c.fillText(k+1,t.x*P,t.y*P+1)});
}
function hit(cv,e){
  const b=cv.getBoundingClientRect(),R=b.width/2,P=R*PLAY,x=(e.clientX-b.left-R)/P,y=(e.clientY-b.top-R)/P,r=Math.hypot(x,y);
  if(r*PLAY>1)return null;if(r>1)return{v:0,m:1,x,y};
  if(r<RB)return{v:50,m:1,x,y};if(r<R25)return{v:25,m:1,x,y};
  let a=Math.atan2(y,x)+PI/2+PI/20;a=(a%(2*PI)+2*PI)%(2*PI);
  return{v:ORDER[Math.floor(a/(PI/10))%20],m:r<T0?1:r<T1?3:r<D0?1:2,x,y};
}
const redraw=()=>{const b=$('bd');if(b)drawBoard(b)};
addEventListener('resize',redraw);try{document.fonts.ready.then(redraw)}catch(e){}

// ---------- Tableaux ----------
function crTable(){
  const sd=S.sides,sym=n=>['','/','X','⊗'][Math.min(n||0,3)],c=i=>i==S.cur&&S.winner==null?'cur':'';
  return `<div class="tbl crt"><table><thead><tr><th></th>${sd.map((s,i)=>`<th class="${c(i)}">${esc(s.name)}</th>`).join('')}</tr></thead><tbody>
  ${S.nums.map(n=>`<tr class="${sd.every(s=>(s.marks[n]||0)>=3)?'dead':''}"><th>${n==25?'Bull':n}</th>${sd.map((s,i)=>`<td class="${c(i)}">${sym(s.marks[n])}</td>`).join('')}</tr>`).join('')}
  <tr class="pts"><th>Points</th>${sd.map((s,i)=>`<td class="${c(i)}">${s.pts}</td>`).join('')}</tr>
  <tr class="mpr"><th>Marques par tour</th>${sd.map(s=>`<td>${avg(s)}</td>`).join('')}</tr></tbody></table></div>`;
}
function scoreBars(rem){
  return `<div class="sbs">${S.sides.map((s,i)=>{const on=i==S.cur,nx=s.mi%s.members.length;return `<div class="sb ${on?'on':''}">
  <div class="sb-n"><b>${esc(s.name)}</b>
  ${s.members.length>1?`<small>${s.members.map((m,k)=>k==nx?`<u>${esc(m)}</u>`:esc(m)).join(', ')}</small>`:''}
  <small><span>Moy. ${avg(s)}</span><span>Dernière ${s.last===''?'–':s.last}</span></small></div>
  <div class="sb-s">${on?rem:s.score}</div></div>`}).join('')}</div>`;
}

// ---------- Partie ----------
function game(){
  if(S.winner!=null)return winScreen();
  const s=S.sides[S.cur],who=thrower(),cr=S.mode!='x01',left=3-S.turn.length;
  const sum=S.turn.reduce((a,d)=>a+d.val,0),rem=S.wait=='bust'?s.score:s.score-sum;
  const co=!cr&&left>0&&!S.wait?checkout(rem,left,S.dout):'';
  const title=cr?(S.mode=='wild'?'Wildcard':'Cricket'):S.start;
  const tags=[!cr&&S.dout?'Double out':'',S.bull50?'Bull unique':'',S.sides.some(x=>x.members.length>1)?'Équipes':''].filter(Boolean);
  const nums=cr?S.nums.filter(n=>n<25):[...Array(20)].map((_,i)=>i+1);
  const input=cfg.input=='clavier'
    ?`<div class="pad"><button class="k mod ${mult==2?'on':''}" data-m="2">Double</button><button class="k mod ${mult==3?'on':''}" data-m="3">Triple</button>${nums.map(n=>`<button class="k" data-k="${n}">${n}</button>`).join('')}<button class="k bull" data-k="25">25</button><button class="k bull2" data-k="50">Bull</button></div>`
    :'<canvas class="board" id="bd" aria-label="Cible : touche l’endroit où la fléchette est plantée"></canvas>';
  const vol=S.wait=='bust'?'Bust':cr?sum+(sum>1?' marques':' marque'):sum;
  app.innerHTML=`<div class="game">${input}<div class="side">
  <div class="top"><div><div class="disp">${title}</div>${tags.length?`<div class="tags">${tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>`:''}</div><div class="round">Tour ${S.round}</div></div>
  ${cr?crTable():scoreBars(rem)}
  <div class="turn"><span class="who">${esc(who)}${s.members.length>1?` <small>${esc(s.name)}</small>`:''}</span>${[0,1,2].map(i=>`<div class="dart ${S.turn[i]?'f':''}">${S.turn[i]?S.turn[i].l:'·'}</div>`).join('')}</div>
  ${co?`<div class="co"><small>Finish conseillé</small><b>${co}</b></div>`:''}
  <div class="msg">${msg}</div>
  ${S.wait?`<button class="go" id="next">Volée ${vol} · Joueur suivant</button>`:''}
  <div class="ctl"><button id="miss">Raté</button><button id="undo">Annuler</button><button id="inp">${cfg.input=='clavier'?'Cible':'Clavier'}</button><button id="menu">Menu</button></div>
  </div></div>`;
  const bd=$('bd');if(bd){drawBoard(bd);bd.onpointerdown=e=>{e.preventDefault();const h=hit(bd,e);if(h)throwDart(h.v,h.m,h.x,h.y)}}
  app.onclick=e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
    if(d.k){const v=+d.k,m=v>20?1:mult;mult=1;throwDart(v,m);game()}
    else if(d.m){mult=mult==+d.m?1:+d.m;game()}
    else if(t.id=='miss')throwDart(0,1)
    else if(t.id=='next')confirmTurn()
    else if(t.id=='undo')undo()
    else if(t.id=='inp'){cfg.input=cfg.input=='clavier'?'cible':'clavier';save();game()}
    else if(t.id=='menu')setup()
  };
}

function throwDart(v,m,x,y){
  if(S.wait||S.winner!=null)return;
  if(v==25&&S.bull50)v=50;
  if(v==0||v==25||v==50)m=1;
  hist.push(JSON.stringify(S));msg='';
  const s=S.sides[S.cur],p=pst(),l=v==0?'0':v==50?'Bull':v==25?'25':(m==3?'T':m==2?'D':'')+v;
  if(S.mode=='x01'){
    const val=v*m,isD=m==2||v==50;S.turn.push({val,x,y,l});
    const tot=S.turn.reduce((a,d)=>a+d.val,0),rest=s.score-tot;
    if(rest<0||(S.dout&&rest==1)||(rest==0&&S.dout&&!isD)){S.wait='bust';msg='Bust : le score reste à '+s.score}
    else if(rest==0){s.darts+=S.turn.length;s.total+=tot;s.score=0;s.last=tot;volee(p,S.turn.length,tot,true);S.winner=S.cur;S.turn=[]}
    else if(S.turn.length==3)S.wait='ok';
  }else{
    const n=v==50?25:v,mk=v==50?2:v==25?1:m;let got=0;
    if(v&&S.nums.includes(n)){
      const have=s.marks[n]||0,close=Math.min(mk,3-Math.min(have,3)),extra=mk-close;
      s.marks[n]=have+close;got=close;
      if(extra>0&&S.sides.some(o=>o!==s&&(o.marks[n]||0)<3)){const g=extra*(n==25?25:n);s.pts+=g;p.pts+=g;got+=extra}
    }
    S.turn.push({val:got,x,y,l});s.darts++;s.total+=got;p.darts++;p.total+=got;
    if(S.nums.every(k=>(s.marks[k]||0)>=3)&&S.sides.every(o=>o===s||s.pts>=o.pts)){
      p.best=Math.max(p.best,S.turn.reduce((a,d)=>a+d.val,0));S.winner=S.cur;S.turn=[]}
    else if(S.turn.length==3)S.wait='ok';
  }
  save();game();
}
function confirmTurn(){
  hist.push(JSON.stringify(S));const s=S.sides[S.cur],p=pst(),tot=S.turn.reduce((a,d)=>a+d.val,0);
  if(S.mode=='x01'){s.darts+=S.turn.length;
    if(S.wait=='bust'){s.last='Bust';volee(p,S.turn.length,0,false)}else{s.total+=tot;s.score-=tot;s.last=tot;volee(p,S.turn.length,tot,false)}}
  else{s.last=tot;p.best=Math.max(p.best,tot)}
  s.mi++;S.wait=false;msg='';S.turn=[];S.cur=(S.cur+1)%S.sides.length;if(S.cur==0){S.round++;if(S.mode=='wild')reroll()}
  save();game();
}
// Wildcard : en fin de tour, les numéros que personne n’a marqués sont remplacés
function reroll(){
  const k=S.nums.filter(n=>n<25&&S.sides.some(s=>(s.marks[n]||0)>0));
  const fresh=shuffle([...Array(20)].map((_,i)=>i+1).filter(n=>!S.nums.includes(n))).slice(0,6-k.length);if(!fresh.length)return;
  S.nums=[...k,...fresh].sort((a,b)=>b-a);S.nums.push(25);
  msg='Nouveaux numéros : '+fresh.sort((a,b)=>b-a).join(', ');
}
function undo(){if(hist.length){S=JSON.parse(hist.pop());msg='';mult=1;save();game()}}

// ---------- Fin de partie ----------
function statsTable(){
  const w=S.sides[S.winner].members,names=S.order,cr=S.mode!='x01';
  const rows=cr?[['Marques par tour',p=>avg(p)],['Meilleur tour',p=>p.best+(p.best>1?' marques':' marque')],['Points marqués',p=>p.pts],['Fléchettes',p=>p.darts]]
    :[['Moyenne (3 fl.)',p=>avg(p)],['Meilleure volée',p=>p.best],['100+',p=>p.t100],['140+',p=>p.t140],['180',p=>p.t180],['Plus gros finish',p=>p.co||'–'],['Fléchettes',p=>p.darts]];
  return `<div class="tbl stats"><table><thead><tr><th></th>${names.map(n=>`<th class="${w.includes(n)?'cur':''}">${esc(n)}</th>`).join('')}</tr></thead>
  <tbody>${rows.map(([l,f])=>`<tr><th>${l}</th>${names.map(n=>`<td class="${w.includes(n)?'w':''}">${f(S.ps[n])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function winScreen(){
  const w=S.sides[S.winner],cr=S.mode!='x01';
  app.innerHTML=`<div class="win"><div class="banner"><small>${cr?(S.mode=='wild'?'Wildcard':'Cricket'):S.start} · vainqueur</small><div class="disp">${esc(w.name)}</div>
  ${w.members.length>1?`<small>${w.members.map(esc).join(', ')}</small>`:''}</div>
  <h2>Statistiques des joueurs</h2>${statsTable()}
  ${cr?`<h2>Tableau final</h2>${crTable()}`:''}
  <div class="btns"><button class="go" id="again">Rejouer</button><button class="sec" id="new">Nouvelle partie</button><button class="sec" id="undo">Annuler la dernière fléchette</button></div></div>`;
  app.onclick=e=>{const t=e.target.closest('button');if(!t)return;
    if(t.id=='new')setup();else if(t.id=='again')startGame();else if(t.id=='undo')undo()};
}

// Empêche le zoom par double-tap (Safari) : deux appuis rapides = deux clics
let lastT=0;document.addEventListener('touchend',e=>{const n=Date.now(),b=e.target.closest('button,canvas');
  if(b&&n-lastT<350){e.preventDefault();if(b.tagName=='BUTTON')b.click()}lastT=n},{passive:false});
try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}
setup();
</script>
