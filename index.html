<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a1730"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Compteur Fléchettes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;600;700&display=swap">
<style>
/* Layout : habillage « retransmission TV » — bandeaux de score biseautés, joueur au lancer en jaune ; cible à gauche, tableau à droite, empilé sur téléphone */
:root{--bg:#0a1730;--band:#11244a;--band2:#183261;--line:#24407a;--fg:#f4f6fb;--mut:#93a3c4;--hl:#ffd23f;--ink:#0a1730;--red:#e63946;--green:#2fbf71;--blue:#4ea8ff;
--disp:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--body:Barlow,system-ui,sans-serif;color-scheme:dark}
html,body{height:100%}
html,button,.board{touch-action:manipulation}
body{background:var(--bg);background-image:linear-gradient(180deg,#0d1d3d 0,var(--bg) 320px);color:var(--fg);font-family:var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
button:active{transform:translateY(1px)}
button:disabled{opacity:.5;cursor:default}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:100%}
#pane{display:flex;flex-direction:column;gap:14px}
.disp{font-family:var(--disp);font-weight:900;line-height:.95;letter-spacing:.01em}
h2{font-family:var(--disp);font-weight:800;font-size:1.5rem;margin:6px 0 0;color:var(--mut)}
.hint{color:var(--mut);font-size:.9rem;line-height:1.4}
.msg{color:var(--red);font-weight:700;min-height:1.2em}
.good{color:var(--green);font-weight:700}
.txt{line-height:1.55;max-width:65ch;margin:0}
input{font:inherit;font-weight:600;background:var(--band);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:10px 12px;min-width:0;flex:1}
a{color:var(--hl)}

/* En-tête et onglets */
.brand{display:flex;align-items:center;gap:14px;padding-block:6px 0}
.brand canvas{width:56px;height:56px;flex:none}
.brand .disp{font-size:clamp(2.4rem,7vw,3.6rem);text-transform:uppercase}
.brand .disp span{color:var(--hl)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--line);padding-bottom:4px}
.tabs button{background:transparent;padding:10px 14px;font-weight:700;border-radius:4px 4px 0 0;white-space:nowrap;color:var(--mut)}
.tabs button.on{background:var(--hl);color:var(--ink)}

/* Cartes de choix */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.mode{background:var(--band);border:1px solid var(--line);border-radius:4px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.mode b{font-family:var(--disp);font-weight:900;font-size:2rem;line-height:1}
.mode small{color:var(--mut);font-size:.85rem;line-height:1.3}
.mode em{font-style:normal;font-size:.82rem;font-weight:700;color:var(--hl)}
.mode.on{background:var(--hl);border-color:var(--hl);color:var(--ink)}
.mode.on small{color:#3d4a66}.mode.on em{color:var(--ink)}

/* Règles en interrupteurs */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.opt{display:flex;align-items:center;gap:12px;background:var(--band);border:1px solid var(--line);border-radius:4px;padding:10px 12px;text-align:left;min-width:0}
.opt span{flex:1;min-width:0}
.opt b{display:block;font-weight:700}
.opt small{color:var(--mut);font-size:.82rem}
.sw{width:46px;height:26px;border-radius:13px;background:#2b3c63;position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--fg);transition:transform .15s}
.opt[aria-checked="true"] .sw{background:var(--green)}
.opt[aria-checked="true"] .sw::after{transform:translateX(20px)}

/* Joueurs */
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;gap:6px;align-items:center}
.ico{width:44px;height:44px;flex:none;background:var(--band);border:1px solid var(--line);border-radius:4px;font-weight:700}
.tm{width:44px;height:44px;flex:none;border-radius:4px;font-family:var(--disp);font-weight:900;font-size:1.5rem;color:var(--ink)}
.t0{background:var(--red)}.t1{background:var(--green)}.t2{background:var(--hl)}.t3{background:var(--blue)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--band2);border-radius:20px;padding:8px 14px;font-weight:700}
.chip.on{background:var(--hl);color:var(--ink)}
.ghost{background:transparent;border:1px dashed var(--line);border-radius:4px;padding:12px;font-weight:700;color:var(--mut)}
.go{background:var(--hl);color:var(--ink);font-family:var(--disp);font-size:1.8rem;font-weight:900;letter-spacing:.02em;padding:12px;border-radius:4px;text-transform:uppercase}
.sec{background:var(--band2);border-radius:4px;padding:12px;font-weight:700}
.danger{background:transparent;border:1px solid var(--red);color:var(--red);border-radius:4px;padding:12px;font-weight:700}
.danger.on{background:var(--red);color:var(--fg)}

/* Partie */
.game{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,400px);gap:16px;flex:1;min-height:0;align-items:start}
.side{display:flex;flex-direction:column;gap:10px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;flex-wrap:wrap}
.top .disp{font-size:2.4rem;text-transform:uppercase}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.78rem;white-space:nowrap;}
.tag.hl{background:var(--hl);color:var(--ink);font-size:.9rem}
.tag{font-weight:700;background:var(--band2);color:var(--mut);border-radius:3px;padding:3px 7px}
.round{font-family:var(--disp);font-weight:800;font-size:1.3rem;color:var(--mut)}

/* Bandeaux de score façon TV */
.sbs{display:flex;flex-direction:column;gap:4px}
.sb{display:grid;grid-template-columns:8px minmax(0,1fr) auto;align-items:center;background:var(--band);clip-path:polygon(0 0,100% 0,calc(100% - 16px) 100%,0 100%);padding-right:26px;min-height:64px}
.sb::before{content:"";align-self:stretch;background:var(--line)}
.sb-n{padding:8px 12px;min-width:0}
.sb-n b{display:block;font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-n small{display:flex;gap:12px;color:var(--mut);font-size:.82rem;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.sb-n u{text-decoration:none;color:var(--hl)}
.sb-s{font-family:var(--disp);font-weight:900;font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.sb.on{background:var(--band2)}
.sb.on::before{background:var(--hl)}
.sb.on .sb-s{color:var(--hl)}

/* Cible d'un exercice */
.target{display:grid;grid-template-columns:8px minmax(0,1fr);background:var(--band2);clip-path:polygon(0 0,100% 0,calc(100% - 16px) 100%,0 100%)}
.target::before{content:"";background:var(--hl)}
.target div{padding:10px 30px 12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.target small{color:var(--mut);font-weight:700}
.target b{font-family:var(--disp);font-weight:900;font-size:4.2rem;line-height:1;color:var(--hl);font-variant-numeric:tabular-nums}
.target span{color:var(--mut);font-variant-numeric:tabular-nums}

.turn{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.who{font-weight:700;margin-right:auto;min-width:0;overflow-wrap:anywhere}
.who small{color:var(--mut);font-weight:400}
.dart{background:var(--band);border-bottom:3px solid var(--line);min-width:60px;padding:6px 8px;text-align:center;font-family:var(--disp);font-size:1.6rem;font-weight:800}
.dart.f{border-color:var(--hl)}
.dart.ok{border-color:var(--green);color:var(--green)}
.co{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--green);color:var(--ink);padding:6px 14px;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.co small{font-weight:700}
.co b{font-family:var(--disp);font-weight:900;font-size:1.9rem;letter-spacing:.02em;padding-right:10px}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(68px,1fr));gap:6px}
.ctl button.on{background:var(--green);border-color:var(--green);color:var(--ink)}
.ctl button{background:var(--band);border:1px solid var(--line);border-radius:4px;padding:12px 0;font-weight:700}

/* Clavier */
.pad{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-content:start}
.k{background:var(--band);border:1px solid var(--line);border-radius:4px;padding:12px 0;font-family:var(--disp);font-size:1.9rem;font-weight:800;font-variant-numeric:tabular-nums}
.k.mod{font-family:var(--body);font-size:1rem;font-weight:700}
.k.mod.on{background:var(--hl);color:var(--ink);border-color:var(--hl)}
.k.bull{background:#1f6b45;border-color:#1f6b45}.k.bull2{background:#9e2730;border-color:#9e2730}
.k.aim{border-color:var(--hl);color:var(--hl)}

.board{display:block;width:100%;max-width:calc(100vh - 40px);max-width:calc(100dvh - 40px);aspect-ratio:1;justify-self:center;cursor:crosshair}

/* Tableaux */
.tbl{overflow-x:auto;background:var(--band);border-radius:4px}
.tbl table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:6px 10px;text-align:center;border-bottom:1px solid var(--line)}
.tbl thead th{font-weight:700;font-size:.9rem;white-space:nowrap;max-width:130px;overflow:hidden;text-overflow:ellipsis;border-bottom:2px solid var(--line)}
.tbl tbody th{text-align:left;white-space:nowrap}
.crt tbody th{font-family:var(--disp);font-size:1.5rem;font-weight:800}
.crt td{font-family:var(--disp);font-size:1.6rem;font-weight:800;line-height:1.1}
.tbl .cur{background:rgba(255,210,63,.1)}
.tbl thead .cur{color:var(--hl);border-bottom-color:var(--hl)}
.crt tr.dead{opacity:.3}
.crt .pts td{color:var(--hl)}
.tbl .mpr th,.tbl .mpr td{font-family:var(--body);font-size:.85rem;font-weight:400;color:var(--mut)}
.stats tbody th{color:var(--mut);font-weight:600;font-size:.9rem}
.stats td{font-family:var(--disp);font-size:1.5rem;font-weight:800}
.stats .w{color:var(--hl)}

/* Stats */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.kpi{background:var(--band);border-radius:4px;padding:10px 12px;min-width:0}
.kpi b{display:block;font-family:var(--disp);font-size:2.2rem;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.kpi small{color:var(--mut);font-size:.85rem}
.kpi.hl b{color:var(--hl)}
.hist{display:flex;flex-direction:column;gap:4px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--band);padding:11px 12px;border-radius:4px;text-align:left;width:100%}
.hrow:hover{background:var(--band2)}
.hrow span{min-width:0;overflow-wrap:anywhere}
.hrow small{color:var(--mut);margin-right:8px;font-variant-numeric:tabular-nums}
.hrow .w{color:var(--green);font-weight:700}.hrow .l{color:var(--mut);font-weight:700}.hrow .s{color:var(--hl);font-weight:700}

/* Compte */
.card{background:var(--band);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:10px;max-width:520px}
.card label{font-weight:700;font-size:.9rem;color:var(--mut);display:flex;flex-direction:column;gap:4px}
.card input{background:var(--bg)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 160px}

/* Victoire */
.win{display:flex;flex-direction:column;gap:14px;padding-block:20px}
.banner{background:var(--hl);color:var(--ink);padding:14px 22px;clip-path:polygon(0 0,100% 0,calc(100% - 24px) 100%,0 100%);animation:in .5s ease-out both}
.banner small{font-weight:700;font-size:1rem}
.banner .disp{font-size:clamp(2.8rem,10vw,5rem);text-transform:uppercase;overflow-wrap:anywhere}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>*{flex:1 1 180px}
@keyframes in{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}

/* Mode écran (Raspberry sous la cible) */
html.tv{font-size:clamp(16px,1.45vw,30px)}
.tv .game{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:center}
.tv .board{cursor:default}
.idle{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4vw;align-items:center;min-height:85vh}
.qr{background:#fff;padding:14px;border-radius:6px;width:min(42vh,40vw)}
.qr img{width:100%;height:auto;display:block;image-rendering:pixelated}
.code{font-family:var(--disp);font-weight:900;font-size:9rem;line-height:.9;color:var(--hl);letter-spacing:.08em}
.live{display:flex;align-items:center;gap:8px}
.scr-x{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));opacity:.35;font-size:.8rem;padding:8px 12px}
.scr-x:hover,.scr-x:focus-visible{opacity:1}
.dot{width:12px;height:12px;border-radius:50%;background:var(--mut);flex:none}
.dot.on{background:var(--green)}
.link{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--band);border-radius:4px;padding:12px}
.link span{flex:1 1 220px;min-width:0}
.link input{flex:0 1 110px;text-transform:uppercase;font-family:var(--disp);font-size:1.4rem;font-weight:800;letter-spacing:.1em}
@media (max-width:760px){.game{grid-template-columns:1fr}.idle{grid-template-columns:1fr}}
@media (max-width:520px){.pad{grid-template-columns:repeat(5,1fr)}.sb-s{font-size:2.6rem}.top .disp{font-size:2rem}.target b{font-size:3.4rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap" id="app"></div>

<script src="supabase.js"></script>
<script src="qrcode.js"></script>
<script>
const $=id=>document.getElementById(id),app=$('app'),KEY='darts2',DBK='darts-db',TEAM='ABCD',PI=Math.PI;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n.toFixed(1).replace('.',',');
const avg=o=>o.darts?fmt(o.total/o.darts*3):'–';
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const uuid=()=>crypto.randomUUID?crypto.randomUUID():'10000000-1000-4000-8000-100000000000'.replace(/[018]/g,c=>(c^Math.random()*16>>c/4).toString(16));
const dateFr=s=>new Date(s).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});

let cfg={mode:'x01',start:501,dout:true,bull50:false,teams:false,random:false,ct:false,input:innerWidth<600?'clavier':'cible',
  players:[{n:'Joueur 1',t:0},{n:'Joueur 2',t:1}],drill:'clock',tp:'',statName:''};
let S=null,T=null,mult=1,msg='',err='',view='match',screen='home';const hist=[];
try{const d=JSON.parse(localStorage.getItem(KEY));if(d){Object.assign(cfg,d.cfg||{});S=d.S&&d.S.ps?d.S:null;T=d.T||null}}catch(e){}
const isScreen=/^#ecran(-[A-Z0-9]{4})?$/i.test(location.hash);if(isScreen)document.documentElement.classList.add('tv');
const save=()=>{if(isScreen)return;try{localStorage.setItem(KEY,JSON.stringify({cfg,S,T}))}catch(e){}};
let live='idle',linkNote='';

// ---------- Profils et historique (sur l'appareil) ----------
let DB={profiles:[],games:[]};
try{const d=JSON.parse(localStorage.getItem(DBK));if(d)DB=Object.assign(DB,d)}catch(e){}
const saveDB=()=>{try{localStorage.setItem(DBK,JSON.stringify(DB))}catch(e){}};
const guest=n=>/^\s*(joueur|player|invit[eé])\s*\d*\s*$/i.test(n);
const lc=s=>s.trim().toLowerCase();
function names(){const m=new Map();DB.profiles.forEach(p=>{if(!p.archived&&!guest(p.name)&&!m.has(lc(p.name)))m.set(lc(p.name),p.name)});return[...m.values()].sort((a,b)=>a.localeCompare(b,'fr'))}
function pidFor(n){if(!n||guest(n))return null;let p=DB.profiles.find(p=>!p.archived&&lc(p.name)==lc(n));
  if(!p){p={id:uuid(),name:n.trim(),created:new Date().toISOString(),sync:0};DB.profiles.push(p);saveDB()}return p.id}
const idsOf=n=>new Set(DB.profiles.filter(p=>lc(p.name)==lc(n)).map(p=>p.id));
function addGame(kind,data){const g={id:uuid(),at:new Date().toISOString(),kind,data,sync:0};DB.games.unshift(g);saveDB();sync();return g.id}
function removeGame(id){const g=DB.games.find(x=>x.id==id);DB.games=DB.games.filter(x=>x.id!=id);saveDB();
  if(g&&g.sync&&sb&&user)sb.from('games').delete().eq('id',id).then(()=>{},()=>{})}

// ---------- Comptes en ligne (Supabase) ----------
const SB_URL='https://baevqabzbajrknxitflm.supabase.co',SB_KEY='sb_publishable_94gFd0AH3y_icshvXM-Ukg_tt4gFiyy';
let sb=null,user=null,syncing=false,syncMsg='',acc={mode:'in',msg:'',ok:'',busy:false,del:false};
try{if(window.supabase)sb=supabase.createClient(SB_URL,SB_KEY)}catch(e){sb=null}
async function sync(){
  if(!sb||!user||syncing)return;syncing=true;
  try{
    const pp=DB.profiles.filter(p=>!p.sync);
    if(pp.length){const{error}=await sb.from('players').upsert(pp.map(p=>({id:p.id,name:p.name,archived:!!p.archived,created_at:p.created})));if(error)throw error;pp.forEach(p=>p.sync=1)}
    const gg=DB.games.filter(g=>!g.sync);
    if(gg.length){const{error}=await sb.from('games').upsert(gg.map(g=>({id:g.id,played_at:g.at,kind:g.kind,data:g.data})));if(error)throw error;gg.forEach(g=>g.sync=1)}
    const[a,b]=await Promise.all([sb.from('players').select('id,name,archived,created_at'),
      sb.from('games').select('id,played_at,kind,data').order('played_at',{ascending:false}).limit(3000)]);
    if(a.error||b.error)throw a.error||b.error;
    // Ce qui a été effacé en ligne (depuis un autre appareil) disparaît aussi ici
    const rpi=new Set(a.data.map(r=>r.id)),rgi=new Set(b.data.map(r=>r.id));
    DB.profiles=DB.profiles.filter(p=>!p.sync||rpi.has(p.id));DB.games=DB.games.filter(g=>!g.sync||rgi.has(g.id));
    const lp=new Map(DB.profiles.map(p=>[p.id,p]));
    a.data.forEach(r=>{const l=lp.get(r.id);if(!l||l.sync)lp.set(r.id,{id:r.id,name:r.name,archived:r.archived,created:r.created_at,sync:1})});
    DB.profiles=[...lp.values()];
    const lg=new Set(DB.games.map(g=>g.id));
    b.data.forEach(r=>{if(!lg.has(r.id))DB.games.push({id:r.id,at:r.played_at,kind:r.kind,data:r.data,sync:1})});
    DB.games.sort((x,y)=>y.at.localeCompare(x.at));DB.last=new Date().toISOString();syncMsg='';saveDB();
  }catch(e){syncMsg='Synchronisation impossible pour le moment. Tes parties restent sur cet appareil et seront envoyées plus tard.'}
  syncing=false;refresh();
}
if(sb){
  sb.auth.getSession().then(({data})=>{user=data.session?data.session.user:null;if(user)sync();if(pendingJoin)joinMain(pendingJoin);else refresh()}).catch(()=>{if(pendingJoin)joinMain(pendingJoin)});
  sb.auth.onAuthStateChange((ev,ses)=>{const was=user;user=ses?ses.user:null;if(user&&!was)setTimeout(sync,0);if(user&&pendingJoin&&!was)setTimeout(()=>joinMain(pendingJoin),0);else refresh()});
  addEventListener('online',()=>sync());
}
function authErr(e){const m=(e&&e.message)||'';
  if(/invalid login/i.test(m))return'E-mail ou mot de passe incorrect.';
  if(/already registered|already exists/i.test(m))return'Un compte existe déjà avec cet e-mail. Connecte-toi.';
  if(/password/i.test(m)&&/6|short|least/i.test(m))return'Le mot de passe doit faire au moins 6 caractères.';
  if(/email.*invalid|invalid.*email/i.test(m))return'Cette adresse e-mail n’est pas valide.';
  if(/not confirmed/i.test(m))return'Ton adresse n’est pas encore confirmée : ouvre le lien reçu par e-mail.';
  if(/invitation/i.test(m))return'Ce code d’invitation n’est pas valide ou a déjà servi le nombre de fois prévu.';

const SEG=(()=>{const o=[];for(let i=20;i>=1;i--)o.push(['T'+i,3*i,2],['S'+i,i,0],['D'+i,2*i,5]);o.push(['25',25,3],['Bull',50,4]);return o})();

function checkout(r,darts,dout){
  if(darts<1||r<(dout?2:1)||r>(dout?170:180))return'';
  const fin=dout?SEG.filter(x=>x[0][0]=='D'||x[0]=='Bull'):SEG,fp=x=>dout?dpen(x):x[2];
  let best=null,bs=1e9;
  const t=(set,f)=>{const s=set.reduce((a,x)=>a+x[2],0)+fp(f);if(s<bs){bs=s;best=[...set.sort((a,b)=>b[1]-a[1]),f]}};
  for(const f of fin)if(f[1]==r)t([],f);
  if(!best&&darts>1)for(const a of SEG)for(const f of fin)if(a[1]+f[1]==r)t([a],f);
  if(!best&&darts>2)for(const a of SEG)for(const b of SEG)for(const f of fin)if(a[1]+b[1]+f[1]==r)t([a,b],f);
  return best?best.map(x=>x[0]).join(' '):'';

  const rest=t.slice(mk.index+mk[0].length).replace(/[,.;:!?]/g,' ').replace(/\b(dix|dis|dit) (sept|cette|set|huit|neuf)\b/g,(a,b,c)=>'dix-'+({cette:'sept',set:'sept'}[c]||c)).replace(/\b(vingt|vin|vain) (et )?(cinq|saint|sein)\b/g,'vingt-cinq').replace(/(\d+)\s*h\b/g,'$1');

  for(const w of rest.split(/\s+/).filter(Boolean)){
    let x=/^([dt])(\d{1,2})$/.exec(w);if(x){const n=+x[2];if(n>=1&&n<=20)out.darts.push([n,x[1]=='d'?2:3]);m=1;continue}
    if(/^(double|doubles|doubler|doublet|doublee|d)$/.test(w)){m=2;continue}if(/^(triple|triples|tripler|triplee|tripple|t)$/.test(w)){m=3;continue}if(w=='simple'){m=1;continue}

    if(/^(rate|ratee|dehors|out|zero|0|manque)$/.test(w)){out.darts.push([0,1]);m=1;continue}
    if(/^(bull|bulle|boule|bool|bul|bulls|centre|50|cinquante)$/.test(w)){out.darts.push([50,1]);m=1;continue}
    const n=/^\d+$/.test(w)?+w:NUMW[w];

function onVoice(alts){if(screen!='game'||!curThrow)return;let r=null,t=alts[0]||'';for(const a of alts){r=parseVoice(a);if(r){t=a;break}}

function throwDart(v,m,x,y){

    else if(rest==0){s.darts+=S.turn.length;s.total+=tot;s.score=0;s.last=tot;volee(p,S.turn.length,tot,true);S.winner=S.cur;S.turn=[]}

    view:st=>{const t=HALVE[st.i];return{big:t=='D'?'Double':t=='T'?'Triple':t=='B'?'Bull':t,sub:`Score ${st.sc} · manche ${st.i+1} sur 12`}},
    dart(st,v,m){const t=HALVE[st.i];let p=0;
      if(t=='D'){if(m==2||v==50)p=v*m}else if(t=='T'){if(m==3)p=v*3}else if(t=='B'){if(v>=25)p=v}else if(v==t)p=v*m;
      if(p){st.sc+=p;st.h++;return{ok:1}}},
    visit(st){if(!st.h){st.sc=Math.floor(st.sc/2);st.msg='Volée ratée : score divisé par deux'}st.h=0;st.i++},
    over:st=>st.i>=12,score:st=>st.sc},
  dbl:{name:'Tour des doubles',desc:'3 fléchettes sur chaque double, de D1 à D20 puis le bull. Compte tes doubles touchés.',better:'high',fmt:s=>`${s} sur 63 (${Math.round(s/63*100)} %)`,
    init:()=>({i:0,hits:0}),act:st=>[tg21(st)],
    view:st=>({big:tg21(st)==25?'Bull':'D'+tg21(st),sub:`${st.hits} touchés · double ${st.i+1} sur 21`}),
    dart(st,v,m){const t=tg21(st);if(t==25?v==50:v==t&&m==2){st.hits++;return{ok:1}}},
    visit(st){st.i++},over:st=>st.i>20,score:st=>st.hits},
  t20:{name:'Scoring T20',desc:'10 volées en visant le triple 20. Marque le plus de points possible.',better:'high',fmt:s=>`${s} points (moy. ${fmt(s/10)})`,
    init:()=>({i:0,sc:0}),act:()=>[20],
    view:st=>({big:'T20',sub:`Volée ${st.i+1} sur 10 · ${st.sc} points${st.i?' · moy. '+fmt(st.sc/st.i):''}`}),
    dart(st,v,m){st.sc+=v*m;if(v==20&&m==3)return{ok:1}},
    visit(st){st.i++},over:st=>st.i>=10,score:st=>st.sc},
};

function tThrow(v,m,x,y){
  if(!T||T.wait||T.done)return;if(v==0||v==25||v==50)m=1;
  hist.push(JSON.stringify(T));msg='';const D=DRILLS[T.drill];
  const r=D.dart(T.st,v,m)||{};T.darts++;T.turn.push({x,y,l:lab(v,m),ok:!!r.ok});if(r.msg)msg=r.msg;
  if(D.over(T.st))tFinish();else if(r.end||T.turn.length==3)T.wait=true;
  save();tGame();
}
function tConfirm(){
  hist.push(JSON.stringify(T));const D=DRILLS[T.drill];if(D.visit)D.visit(T.st);
  T.turn=[];T.wait=false;msg=T.st.msg||'';T.st.msg='';if(D.over(T.st))tFinish();save();tGame();
}
function tFinish(){const D=DRILLS[T.drill];T.done=true;T.wait=false;T.score=D.score(T.st,T);T.prev=bestDrill(T.name,T.drill);
  T.gid=T.pid?addGame('drill',{drill:T.drill,pid:T.pid,name:T.name,score:T.score,darts:T.darts}):null}
function tUndo(){if(!hist.length)return;const gid=T.gid;T=JSON.parse(hist.pop());if(gid&&T.gid!==gid)removeGame(gid);msg='';save();tGame()}
function tResult(){voiceStop();
  const D=DRILLS[T.drill],rec=T.pid&&(T.prev==null||(D.better=='low'?T.score<T.prev:T.score>T.prev));

  ${isScreen?'':'<div class="btns"><button class="go" id="again">Recommencer</button><button class="sec" id="back">Retour au menu</button><button class="sec" id="undo">Annuler la dernière fléchette</button></div>'}</div>`;
  app.onclick=e=>{const t=e.target.closest('button');if(!t)return;
    if(t.id=='again'){cfg.drill=T.drill;tStart(T.name)}else if(t.id=='back'){T=null;save();home('train')}else if(t.id=='undo')tUndo()};
}

const modeKey=d=>d.mode=='x01'?String(d.start):d.mode;
const MODE_NAMES={'301':'301','501':'501','701':'701',cricket:'Cricket',wild:'Wildcard'};
const modeLabel=d=>MODE_NAMES[modeKey(d)]+(d.ct?' cut throat':'')+(d.teams?' en équipe':'');
const dtFr=s=>new Date(s).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
function statsFor(name){
  const ids=idsOf(name),r={m:0,w:0,tr:0,modes:{},dr:{},list:[]};
  for(const g of DB.games){const d=g.data;
    if(g.kind=='match'){const p=(d.players||[]).find(p=>ids.has(p.pid));if(!p)continue;const k=modeKey(d);if(!MODE_NAMES[k])continue;
      r.m++;if(p.won)r.w++;
      const o=r.modes[k]||(r.modes[k]={n:0,w:0,d:0,t:0,best:0,ba:0,co:0,t180:0,t140:0,t100:0});
      o.n++;if(p.won)o.w++;o.d+=p.darts;o.t+=p.total;o.best=Math.max(o.best,p.best);o.co=Math.max(o.co,p.co||0);
      o.t180+=p.t180||0;o.t140+=p.t140||0;o.t100+=p.t100||0;if(k!='cricket'&&k!='wild'&&p.darts>=9)o.ba=Math.max(o.ba,p.total/p.darts*3);
      r.list.push({g,k,label:modeLabel(d),res:p.won?'Victoire':'Défaite',cls:p.won?'w':'l'})}
    else if(g.kind=='drill'&&ids.has(d.pid)){const D=DRILLS[d.drill];if(!D)continue;r.tr++;
      const o=r.dr[d.drill]||(r.dr[d.drill]={n:0,best:null,sum:0,last:null});o.n++;o.sum+=d.score;if(o.last==null)o.last=d.score;
      if(o.best==null||(D.better=='low'?d.score<o.best:d.score>o.best))o.best=d.score;
      r.list.push({g,k:'train',label:D.name,res:D.fmt(d.score).replace(/ \(.*/,''),cls:'s'})}}
  return r;
}

    return}
  const up=acc.mode=='up';
  pane.innerHTML=`<div class="card">
  <div class="chips"><button class="chip ${up?'':'on'}" data-am="in">Se connecter</button><button class="chip ${up?'on':''}" data-am="up">Créer un compte</button></div>
  <p class="txt">${up?'Crée ton compte pour retrouver tes joueurs et tes stats sur tous tes appareils. Il te faut un code d’invitation, demande-le à l’organisateur. Les parties déjà jouées sur cet appareil seront ajoutées à ton compte.':'Connecte-toi pour retrouver tes stats.'}</p>
  <form id="af" class="card" style="padding:0;background:none">
  ${up?'<label>Code d’invitation<input id="ai" autocomplete="off" maxlength="40" required style="text-transform:uppercase"></label><label>Pseudo<input id="ap" autocomplete="nickname" maxlength="30" required></label>':''}
  <label>E-mail<input id="ae" type="email" autocomplete="email" required></label>
  <label>Mot de passe<input id="aw" type="password" autocomplete="${up?'new-password':'current-password'}" minlength="6" required></label>
  ${up?'<div class="hint">Au moins 6 caractères.</div>':''}
  <div class="msg">${acc.msg}</div>${acc.ok?`<div class="good">${acc.ok}</div>`:''}
  <button class="go" type="submit" ${acc.busy?'disabled':''}>${acc.busy?'Patiente…':up?'Créer mon compte':'Se connecter'}</button>
  </form>
  ${up?'<div class="hint">En créant un compte, tu acceptes la <a href="#" data-go="privacy">politique de confidentialité</a>.</div>':'<button class="ghost" data-go="privacy">Confidentialité</button>'}</div>`;
  pane.onclick=e=>{const t=e.target.closest('[data-am],[data-go]');if(!t)return;e.preventDefault();
    if(t.dataset.go)return home('privacy');acc.mode=t.dataset.am;acc.msg='';acc.ok='';accountView()};
  $('af').onsubmit=async e=>{e.preventDefault();const em=$('ae').value.trim(),pw=$('aw').value,ps=up?$('ap').value.trim():'',iv=up?$('ai').value.trim().toUpperCase():'';
    if(up&&!iv){acc.msg='Entre le code d’invitation que l’on t’a donné.';return accountView()}
    if(up&&!ps){acc.msg='Choisis un pseudo.';return accountView()}
    acc.busy=true;acc.msg='';acc.ok='';accountView();
    try{if(up){const{data,error}=await sb.auth.signUp({email:em,password:pw,options:{data:{pseudo:ps,invite:iv}}});if(error)throw error;
        if(!data.session){acc.ok='Compte créé. Ouvre le lien reçu par e-mail pour le confirmer, puis connecte-toi.';acc.mode='in'}}
      else{const{error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error)throw error}}
    catch(er){acc.msg=authErr(er)}
    acc.busy=false;refresh()};
}
function clearAccountData(all){DB={profiles:all?[]:DB.profiles.filter(p=>!p.sync),games:all?[]:DB.games.filter(g=>!g.sync)};saveDB();acc.del=false}

  $('pane').innerHTML=`<div class="card" style="max-width:720px"><div class="disp" style="font-size:2.2rem">Confidentialité</div>
  <p class="txt">Score Fléchettes fonctionne sans compte : tes joueurs et tes stats restent alors uniquement sur ton appareil.</p>
  <p class="txt"><b>Si tu crées un compte</b>, on enregistre ton adresse e-mail, ton pseudo, ton mot de passe (chiffré, illisible même pour l’éditeur), les noms des joueurs que tu crées et les résultats de tes matchs et entraînements.</p>
  <p class="txt"><b>Pourquoi :</b> uniquement pour te connecter et retrouver tes stats sur tous tes appareils. Pas de publicité, pas de revente, aucun partage avec des tiers.</p>
  <p class="txt"><b>Où :</b> chez notre hébergeur Supabase, sur des serveurs situés dans l’Union européenne (Irlande).</p>
  <p class="txt"><b>Combien de temps :</b> tant que ton compte existe. Le bouton « Supprimer mon compte » efface immédiatement ton compte et toutes tes données en ligne.</p>
  <p class="txt"><b>Tes droits (RGPD) :</b> tu peux consulter, corriger ou supprimer tes données à tout moment depuis l’appli. Pour toute autre demande, contacte l’éditeur de Score Fléchettes.</p>
  <button class="sec" data-view="compte">Retour</button></div>`;
}

try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}
{const jn=/^#rejoindre-([A-Z0-9]{4})$/i.exec(location.hash);
if(isScreen)screenMain();
