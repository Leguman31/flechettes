<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121512"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<title>Compteur Fléchettes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Barlow:wght@400;600&display=swap">
<style>
/* Layout: tableau des joueurs en haut, clavier de cible en bas, plein écran tablette */
:root{--bg:#121512;--panel:#1c211c;--line:#2d352d;--fg:#f1efe6;--mut:#9aa596;--red:#d8352c;--green:#2f9a55;--cream:#efe6c8;
--disp:"Barlow Condensed",Impact,sans-serif;--body:Barlow,system-ui,sans-serif;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
h1{font-family:var(--disp);font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:1.6rem;margin:0}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:12px;height:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lbl{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.chip{background:var(--panel);border:1px solid var(--line);padding:10px 16px;border-radius:6px;font-weight:600}
.chip.on{background:var(--green);border-color:var(--green)}
input{font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-width:0;flex:1}
.go{background:var(--red);font-family:var(--disp);font-size:1.4rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:14px;border-radius:8px}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.p{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.p.cur{border-color:var(--cream);box-shadow:inset 0 0 0 1px var(--cream)}
.p .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p .s{font-family:var(--disp);font-weight:800;font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums}
.p .m{font-size:.8rem;color:var(--mut);font-variant-numeric:tabular-nums}
.turn{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dart{background:var(--panel);border:1px solid var(--line);border-radius:6px;min-width:64px;padding:6px 10px;text-align:center;font-family:var(--disp);font-size:1.4rem;font-weight:700}
.co{color:var(--cream);font-family:var(--disp);font-size:1.3rem;letter-spacing:.04em}
.msg{color:var(--red);font-weight:600;min-height:1.2em}
.pad{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:auto}
.k{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 0;font-family:var(--disp);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.k:nth-child(odd){background:#1f2a21}
.k.mod{font-size:1.1rem;letter-spacing:.06em;text-transform:uppercase}
.k.mod.on{background:var(--red);border-color:var(--red)}
.k.bull{background:var(--green)}.k.bull2{background:var(--red)}
.k.ctl{background:#2a2f2a;font-size:1.1rem;text-transform:uppercase}
.game{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,360px);gap:16px;flex:1;min-height:0;align-items:start}
.side{display:flex;flex-direction:column;gap:10px;min-width:0}
.side .players{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.board{display:block;width:100%;max-width:calc(100vh - 40px);max-width:calc(100dvh - 40px);aspect-ratio:1;justify-self:center;touch-action:manipulation;cursor:crosshair}
.ctl3{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ctl3 .k{font-size:1.1rem;text-transform:uppercase}
@media (max-width:760px){.game{grid-template-columns:1fr}}
.win{text-align:center;padding:30px 0;display:flex;flex-direction:column;gap:16px;align-items:center}
.win .big{font-family:var(--disp);font-size:3rem;font-weight:800;text-transform:uppercase}
@media (max-width:520px){.pad{grid-template-columns:repeat(5,1fr)}.p .s{font-size:2.4rem}}
</style>

<div class="wrap" id="app"></div>

<script>
const app=document.getElementById('app');
let S;const hist=[];
const save=()=>{try{localStorage.setItem('darts',JSON.stringify({S,names:cfg.names,input:cfg.input,bull50:cfg.bull50}))}catch(e){}};
let cfg={start:501,dout:true,names:['Joueur 1','Joueur 2'],input:innerWidth<600?'clavier':'cible'};
try{const d=JSON.parse(localStorage.getItem('darts'));if(d){if(d.names)cfg.names=d.names;if(d.input)cfg.input=d.input;if(d.bull50)cfg.bull50=true;if(d.S)S=d.S}}catch(e){}
let mult=1,msg='';

// Suggestions de finish (double-out)
function checkout(r,darts){
  if(r>170||r<2)return'';
  const opts=[];for(let i=1;i<=20;i++){opts.push(['S'+i,i],['D'+i,2*i],['T'+i,3*i])}opts.push(['25',25],['Bull',50]);
  const dbl=opts.filter(o=>o[0][0]=='D'||o[0]=='Bull');
  for(const d of dbl)if(d[1]==r)return d[0];
  if(darts>1)for(const a of opts)for(const d of dbl)if(a[1]+d[1]==r)return a[0]+' '+d[0];
  if(darts>2)for(const a of opts.filter(o=>o[0][0]=='T'||o[0]=='Bull').concat(opts))for(const b of opts)for(const d of dbl)if(a[1]+b[1]+d[1]==r)return a[0]+' '+b[0]+' '+d[0];
  return'';
}

function setup(){
  app.innerHTML=`<h1>Fléchettes</h1>
  <div class="lbl">Partie</div>
  <div class="row">${[301,501,701].map(v=>`<button class="chip ${cfg.start==v?'on':''}" data-s="${v}">${v}</button>`).join('')}
  <button class="chip ${cfg.dout?'on':''}" id="dout">Finir sur un double</button><button class="chip ${cfg.bull50?'':'on'}" id="bull">Double bull</button></div>
  <div class="lbl">Joueurs</div>
  <div id="pl" style="display:flex;flex-direction:column;gap:6px">${cfg.names.map((n,i)=>`<div class="row"><input id="n${i}" value="${n.replace(/"/g,'&quot;')}"><button class="chip" data-del="${i}">✕</button></div>`).join('')}</div>
  <div class="row"><button class="chip" id="add">+ Ajouter un joueur</button></div>
  <button class="go" id="start">Lancer la partie</button>
  ${S&&!S.winner?'<button class="chip" id="resume">Reprendre la partie en cours</button>':''}`;
  const read=()=>cfg.names=cfg.names.map((_,i)=>document.getElementById('n'+i).value.trim()||'Joueur '+(i+1));
  app.onclick=e=>{const t=e.target.closest('button');if(!t)return;read();
    if(t.dataset.s){cfg.start=+t.dataset.s;setup()}
    else if(t.id=='dout'){cfg.dout=!cfg.dout;setup()}
    else if(t.id=='bull'){cfg.bull50=!cfg.bull50;setup()}
    else if(t.id=='add'){cfg.names.push('Joueur '+(cfg.names.length+1));setup()}
    else if(t.dataset.del){if(cfg.names.length>1)cfg.names.splice(+t.dataset.del,1);setup()}
    else if(t.id=='resume')game()
    else if(t.id=='start'){S={start:cfg.start,dout:cfg.dout,bull50:!!cfg.bull50,cur:0,turn:[],winner:null,round:1,
      P:cfg.names.map(n=>({n,score:cfg.start,darts:0,pts:0,last:''}))};hist.length=0;save();game()}
  };
}

function game(){
  if(S.winner!=null){
    const w=S.P[S.winner];
    app.innerHTML=`<div class="win"><div class="lbl">Victoire</div><div class="big">${w.n}</div>
    <div>${w.darts} fléchettes · moyenne ${(w.pts/w.darts*3).toFixed(1)} par volée</div>
    <div class="row"><button class="chip" id="undo">Annuler la dernière</button><button class="go" id="new">Nouvelle partie</button></div></div>`;
    app.onclick=e=>{const t=e.target.closest('button');if(!t)return;if(t.id=='new')setup();if(t.id=='undo')undo()};return}
  const p=S.P[S.cur],left=3-S.turn.length,rem=S.wait=='bust'?p.score:p.score-S.turn.reduce((a,d)=>a+d.val,0),co=S.dout?checkout(rem,left):'';
  app.innerHTML=`<div class="game">${cfg.input=='clavier'?`<div class="pad"><button class="k mod ${mult==2?'on':''}" data-m="2">Double</button><button class="k mod ${mult==3?'on':''}" data-m="3">Triple</button>${Array.from({length:20},(_,i)=>`<button class="k" data-k="${i+1}">${i+1}</button>`).join('')}<button class="k bull" data-k="25">25</button><button class="k bull2" data-k="50">Bull</button></div>`:'<canvas class="board" id="bd"></canvas>'}<div class="side"><div class="row" style="justify-content:space-between"><h1>${S.start}${S.dout?' · Double out':''}${S.bull50?' · Bull unique':''}</h1><span class="lbl">Tour ${S.round}</span></div>
  <div class="players">${S.P.map((q,i)=>`<div class="p ${i==S.cur?'cur':''}"><div class="n">${q.n}</div><div class="s">${i==S.cur?rem:q.score}</div>
  <div class="m">Moy. ${q.darts?(q.pts/q.darts*3).toFixed(1):'–'} · Dernière ${q.last||'–'}</div></div>`).join('')}</div>
  <div class="turn"><span class="lbl">${p.n}</span>${[0,1,2].map(i=>`<div class="dart">${S.turn[i]?S.turn[i].l:'·'}</div>`).join('')}
  ${co?`<span class="co">Finish : ${co}</span>`:''}</div>
  <div class="msg">${msg}</div>
  ${S.wait?`<button class="go" id="next">Volée : ${S.wait=='bust'?'Bust':S.turn.reduce((a,d)=>a+d.val,0)} · Joueur suivant</button>`:''}
  <div class="ctl3"><button class="k" data-v="0">Raté</button><button class="k ctl" id="undo">Annuler</button><button class="k ctl" id="inp">${cfg.input=='clavier'?'Cible':'Clavier'}</button><button class="k ctl" id="menu">Menu</button></div>
  </div></div>`;
  const bd=document.getElementById('bd');if(bd){drawBoard(bd);
  bd.onpointerdown=e=>{e.preventDefault();const h=hit(bd,e);if(h)throwDart(h.v,h.m,h.x,h.y)}}
  app.onclick=e=>{const t=e.target.closest('button');if(!t)return;
    if(t.dataset.k){const v=+t.dataset.k,m=v>20?1:mult;mult=1;throwDart(v,m);game()}
    else if(t.dataset.m){mult=mult==+t.dataset.m?1:+t.dataset.m;game()}
    else if(t.id=='inp'){cfg.input=cfg.input=='clavier'?'cible':'clavier';save();game()}
    else if(t.dataset.v)throwDart(0,1)
    else if(t.id=='next')confirmTurn()
    else if(t.id=='undo')undo()
    else if(t.id=='menu'){cfg.names=S.P.map(q=>q.n);setup()}
  };
}

const ORDER=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5],PI=Math.PI;
// Proportions élargies (triples et doubles plus épais que sur une vraie cible) pour viser au doigt
const RB=.07,R25=.15,T0=.5,T1=.62,D0=.86,PLAY=.84;
function drawBoard(cv){
  const s=cv.clientWidth;if(!s)return;const d=devicePixelRatio||1;cv.width=cv.height=s*d;
  const c=cv.getContext('2d');c.scale(d,d);const R=s/2,P=R*PLAY;c.translate(R,R);
  c.fillStyle='#0b0d0b';c.beginPath();c.arc(0,0,R,0,7);c.fill();
  const ring=(r0,r1,col,a0,a1)=>{c.beginPath();c.arc(0,0,r1*P,a0,a1);c.arc(0,0,r0*P,a1,a0,true);c.closePath();c.fillStyle=col;c.fill()};
  c.font=`700 ${R*.12}px "Barlow Condensed",Impact,sans-serif`;c.textAlign='center';c.textBaseline='middle';
  for(let i=0;i<20;i++){const a0=(i-.5)*PI/10-PI/2,a1=a0+PI/10,dk=i%2==0,sc=dk?'#1d1d1b':'#efe6c8',mc=dk?'#d8352c':'#2f9a55';
    ring(R25,T0,sc,a0,a1);ring(T0,T1,mc,a0,a1);ring(T1,D0,sc,a0,a1);ring(D0,1,mc,a0,a1);
    c.fillStyle='#f1efe6';const am=a0+PI/20;c.fillText(ORDER[i],Math.cos(am)*R*.92,Math.sin(am)*R*.92)}
  ring(RB,R25,'#2f9a55',0,7);ring(0,RB,'#d8352c',0,7);
  c.strokeStyle='rgba(180,180,170,.5)';c.lineWidth=1;[RB,R25,T0,T1,D0,1].forEach(r=>{c.beginPath();c.arc(0,0,r*P,0,7);c.stroke()});
  (S&&S.turn||[]).forEach((t,k)=>{if(t.x==null)return;c.beginPath();c.arc(t.x*P,t.y*P,R*.035,0,7);c.fillStyle='#fff';c.fill();c.lineWidth=3;c.strokeStyle='#121512';c.stroke();
    c.fillStyle='#121512';c.font=`700 ${R*.04}px sans-serif`;c.fillText(k+1,t.x*P,t.y*P)});
}
function hit(cv,e){
  const b=cv.getBoundingClientRect(),R=b.width/2,P=R*PLAY,x=(e.clientX-b.left-R)/P,y=(e.clientY-b.top-R)/P,r=Math.hypot(x,y);
  if(r*PLAY>1)return null;if(r>1)return{v:0,m:1,x,y};
  if(r<RB)return{v:50,m:1,x,y};if(r<R25)return{v:25,m:1,x,y};
  let a=Math.atan2(y,x)+PI/2+PI/20;a=(a%(2*PI)+2*PI)%(2*PI);
  return{v:ORDER[Math.floor(a/(PI/10))%20],m:r<T0?1:r<T1?3:r<D0?1:2,x,y};
}
addEventListener('resize',()=>{const b=document.getElementById('bd');if(b)drawBoard(b)});
try{document.fonts.ready.then(()=>{const b=document.getElementById('bd');if(b)drawBoard(b)})}catch(e){}

function throwDart(v,m,x,y){
  if(S.wait)return;
  if(v==25&&S.bull50)v=50;
  hist.push(JSON.stringify(S));msg='';
  const val=v*m,isD=m==2||v==50;
  const p=S.P[S.cur];
  S.turn.push({val,x,y,l:v==0?'0':v==50?'Bull':v==25?'25':(m==3?'T':m==2?'D':'')+v});
  const tot=S.turn.reduce((a,d)=>a+d.val,0),rest=p.score-tot;
  const bust=rest<0||(S.dout&&rest==1)||(S.dout&&rest==0&&!isD);
  if(bust){S.wait='bust';msg='Bust : le score reste à '+p.score}
  else if(rest==0){p.darts+=S.turn.length;p.pts+=tot;p.score=0;p.last=tot;S.winner=S.cur;S.turn=[]}
  else if(S.turn.length==3)S.wait='ok';
  save();game();
}
function confirmTurn(){
  hist.push(JSON.stringify(S));const p=S.P[S.cur],tot=S.turn.reduce((a,d)=>a+d.val,0);
  p.darts+=S.turn.length;if(S.wait=='bust')p.last='Bust';else{p.pts+=tot;p.score-=tot;p.last=tot}
  S.wait=false;msg='';next();save();game();
}
function next(){S.turn=[];S.cur=(S.cur+1)%S.P.length;if(S.cur==0)S.round++}
function undo(){if(hist.length){S=JSON.parse(hist.pop());msg='';mult=1;save();game()}}

try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}
setup();
</script>

<script>if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})</script>
</html>
