<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121512"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png">
<title>Compteur Fléchettes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Barlow:wght@400;600&display=swap">
<style>
/* Layout: cible (ou clavier) à gauche, tableau des scores à droite ; empilé sur téléphone */
:root{--bg:#121512;--panel:#1c211c;--line:#2d352d;--fg:#f1efe6;--mut:#9aa596;--red:#d8352c;--green:#2f9a55;--cream:#efe6c8;--gold:#c9a227;--blue:#3b7dd8;
--disp:"Barlow Condensed",Impact,sans-serif;--body:Barlow,system-ui,sans-serif;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
h1{font-family:var(--disp);font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:1.6rem;margin:0;text-wrap:balance}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:12px;min-height:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lbl{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.hint{color:var(--mut);font-size:.9rem}
.chip{background:var(--panel);border:1px solid var(--line);padding:10px 16px;border-radius:6px;font-weight:600}
.chip.on{background:var(--green);border-color:var(--green)}
.chip.sq{width:44px;padding:10px 0;flex:none}
.team{flex:none;min-width:104px}
.t0{background:var(--red);border-color:var(--red)}.t1{background:var(--green);border-color:var(--green)}
.t2{background:var(--gold);border-color:var(--gold);color:#121512}.t3{background:var(--blue);border-color:var(--blue)}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;gap:6px;align-items:center}
input{font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-width:0;flex:1}
.go{background:var(--red);font-family:var(--disp);font-size:1.4rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:14px;border-radius:8px}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.p{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.p.cur{border-color:var(--cream);box-shadow:inset 0 0 0 1px var(--cream)}
.p .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p .s{font-family:var(--disp);font-weight:800;font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums}
.p .m{font-size:.8rem;color:var(--mut);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.turn{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dart{background:var(--panel);border:1px solid var(--line);border-radius:6px;min-width:64px;padding:6px 10px;text-align:center;font-family:var(--disp);font-size:1.4rem;font-weight:700}
.co{color:var(--cream);font-family:var(--disp);font-size:1.3rem;letter-spacing:.04em}
.msg{color:var(--red);font-weight:600;min-height:1.2em}
.crt{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.crt table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.crt th,.crt td{padding:5px 8px;text-align:center;border-bottom:1px solid var(--line)}
.crt thead th{font-weight:600;font-size:.85rem;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.crt tbody th{text-align:left;font-family:var(--disp);font-size:1.3rem;font-weight:700}
.crt td{font-family:var(--disp);font-size:1.5rem;font-weight:700;line-height:1.1}
.crt .cur{background:rgba(239,230,200,.09)}
.crt tr.dead{opacity:.3}
.crt .pts td{color:var(--cream)}
.crt .mpr td,.crt .mpr th{font-family:var(--body);font-size:.8rem;font-weight:400;color:var(--mut)}
.pad{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-content:start}
.k{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 0;font-family:var(--disp);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.k.mod{font-size:1.1rem;letter-spacing:.06em;text-transform:uppercase}
.k.mod.on{background:var(--red);border-color:var(--red)}
.k.bull{background:var(--green)}.k.bull2{background:var(--red)}
.k.ctl{background:#2a2f2a;font-size:1.1rem;text-transform:uppercase}
.game{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,380px);gap:16px;flex:1;min-height:0;align-items:start}
.side{display:flex;flex-direction:column;gap:10px;min-width:0}
.board{display:block;width:100%;max-width:calc(100vh - 40px);max-width:calc(100dvh - 40px);aspect-ratio:1;justify-self:center;touch-action:manipulation;cursor:crosshair}
.ctl3{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ctl3 .k{font-size:1.05rem;text-transform:uppercase}
.win{text-align:center;padding:30px 0;display:flex;flex-direction:column;gap:16px;align-items:center}
.win .big{font-family:var(--disp);font-size:3rem;font-weight:800;text-transform:uppercase;overflow-wrap:anywhere}
.win .crt{width:100%;max-width:560px}
@media (max-width:760px){.game{grid-template-columns:1fr}}
@media (max-width:520px){.pad{grid-template-columns:repeat(5,1fr)}.p .s{font-size:2.4rem}.team{min-width:88px;padding-inline:8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="app"></div>

<script>
const $=id=>document.getElementById(id),app=$('app'),KEY='darts2',TEAM='ABCD';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cfg={mode:'x01',start:501,dout:true,bull50:false,teams:false,random:false,input:innerWidth<600?'clavier':'cible',
  players:[{n:'Joueur 1',t:0},{n:'Joueur 2',t:1}]};
let S=null,mult=1,msg='',err='';const hist=[];
try{const d=JSON.parse(localStorage.getItem(KEY));if(d){Object.assign(cfg,d.cfg||{});S=d.S||null}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({cfg,S}))}catch(e){}};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const avg=s=>s.darts?(s.total/s.darts*3).toFixed(1):'–';

// ---------- Réglages ----------
function setup(){
  const P=cfg.players,x=cfg.mode=='x01',cur=x?String(cfg.start):cfg.mode;
  app.innerHTML=`<h1>Fléchettes</h1>
  <div class="lbl">Jeu</div>
  <div class="row">${[['301','301'],['501','501'],['701','701'],['cricket','Cricket'],['wild','Cricket Wildcard']]
    .map(([id,l])=>`<button class="chip ${cur==id?'on':''}" data-mode="${id}">${l}</button>`).join('')}</div>
  ${cfg.mode=='wild'?'<div class="hint">6 numéros tirés au hasard à chaque partie, plus le bull.</div>':''}
  <div class="lbl">Options</div>
  <div class="row">${x?`<button class="chip ${cfg.dout?'on':''}" id="dout">Finir sur un double</button>`:''}
  <button class="chip ${cfg.bull50?'':'on'}" id="bull">Double bull</button>
  <button class="chip ${cfg.teams?'on':''}" id="teams">Jouer en équipes</button>
  <button class="chip ${cfg.random?'on':''}" id="rnd">Ordre aléatoire</button></div>
  <div class="lbl">Joueurs · ${cfg.random?'ordre tiré au sort au lancement':'dans l\'ordre de jeu'}</div>
  <div class="plist">${P.map((p,i)=>`<div class="prow"><input id="n${i}" value="${esc(p.n)}" aria-label="Nom du joueur ${i+1}">
    ${cfg.teams?`<button class="chip team t${p.t}" data-team="${i}">Équipe ${TEAM[p.t]}</button>`:''}
    ${cfg.random?'':`<button class="chip sq" data-up="${i}" aria-label="Monter">↑</button><button class="chip sq" data-dn="${i}" aria-label="Descendre">↓</button>`}
    <button class="chip sq" data-del="${i}" aria-label="Retirer">✕</button></div>`).join('')}</div>
  ${cfg.teams?'<div class="hint">Touche une équipe pour la changer. Les coéquipiers partagent le score et jouent chacun leur tour.</div>':''}
  <div class="row"><button class="chip" id="add">+ Ajouter un joueur</button></div>
  <div class="msg">${err}</div>
  <button class="go" id="start">Lancer la partie</button>
  ${S&&S.winner==null?'<button class="chip" id="resume">Reprendre la partie en cours</button>':''}`;
  app.onclick=e=>{const t=e.target.closest('button');if(!t)return;
    P.forEach((p,i)=>{const v=$('n'+i).value.trim();p.n=v||'Joueur '+(i+1)});err='';const d=t.dataset;
    if(d.mode){if(/^\d+$/.test(d.mode)){cfg.mode='x01';cfg.start=+d.mode}else cfg.mode=d.mode}
    else if(t.id=='dout')cfg.dout=!cfg.dout
    else if(t.id=='bull')cfg.bull50=!cfg.bull50
    else if(t.id=='teams')cfg.teams=!cfg.teams
    else if(t.id=='rnd')cfg.random=!cfg.random
    else if(d.team){const p=P[+d.team];p.t=(p.t+1)%4}
    else if(d.up){const i=+d.up;if(i>0)[P[i-1],P[i]]=[P[i],P[i-1]]}
    else if(d.dn){const i=+d.dn;if(i<P.length-1)[P[i+1],P[i]]=[P[i],P[i+1]]}
    else if(d.del){if(P.length>1)P.splice(+d.del,1)}
    else if(t.id=='add')P.push({n:'Joueur '+(P.length+1),t:P.length%2})
    else if(t.id=='resume'){mult=1;msg='';return game()}
    else if(t.id=='start'){if(startGame())return}
    save();setup();
  };
}

function startGame(){
  const P=cfg.players.map(p=>({...p}));if(cfg.random)shuffle(P);
  let sides;
  if(cfg.teams){const m=new Map();P.forEach(p=>{if(!m.has(p.t))m.set(p.t,[]);m.get(p.t).push(p.n)});
    if(m.size<2){err='Répartis les joueurs dans au moins deux équipes.';return false}
    sides=[...m].map(([t,mem])=>({name:'Équipe '+TEAM[t],members:mem}))}
  else sides=P.map(p=>({name:p.n,members:[p.n]}));
  let nums=[20,19,18,17,16,15];
  if(cfg.mode=='wild')nums=shuffle([...Array(20)].map((_,i)=>i+1)).slice(0,6).sort((a,b)=>b-a);
  if(cfg.mode!='x01')nums.push(25);
  S={mode:cfg.mode,start:cfg.start,dout:cfg.dout,bull50:cfg.bull50,nums,cur:0,round:1,turn:[],wait:false,winner:null,
    sides:sides.map(s=>({...s,mi:0,score:cfg.start,pts:0,marks:{},darts:0,total:0,last:''}))};
  hist.length=0;mult=1;msg='';save();game();return true;
}

// ---------- Suggestions de finish (double out) ----------
function checkout(r,darts){
  if(r>170||r<2)return'';
  const o=[];for(let i=1;i<=20;i++)o.push(['S'+i,i],['D'+i,2*i],['T'+i,3*i]);o.push(['25',25],['Bull',50]);
  const dbl=o.filter(x=>x[0][0]=='D'||x[0]=='Bull');
  for(const d of dbl)if(d[1]==r)return d[0];
  if(darts>1)for(const a of o)for(const d of dbl)if(a[1]+d[1]==r)return a[0]+' '+d[0];
  if(darts>2)for(const a of o.filter(x=>x[0][0]=='T'||x[0]=='Bull').concat(o))for(const b of o)for(const d of dbl)if(a[1]+b[1]+d[1]==r)return a[0]+' '+b[0]+' '+d[0];
  return'';
}

// ---------- Cible ----------
const ORDER=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5],PI=Math.PI;
// Proportions élargies (triples et doubles plus épais que sur une vraie cible) pour viser au doigt
const RB=.07,R25=.15,T0=.5,T1=.62,D0=.86,PLAY=.84;
function drawBoard(cv){
  const s=cv.clientWidth;if(!s)return;const d=devicePixelRatio||1;cv.width=cv.height=s*d;
  const c=cv.getContext('2d');c.scale(d,d);const R=s/2,P=R*PLAY;c.translate(R,R);
  const act=S&&S.mode!='x01'?S.nums:null;
  c.fillStyle='#0b0d0b';c.beginPath();c.arc(0,0,R,0,7);c.fill();
  const ring=(r0,r1,col,a0,a1)=>{c.beginPath();c.arc(0,0,r1*P,a0,a1);c.arc(0,0,r0*P,a1,a0,true);c.closePath();c.fillStyle=col;c.fill()};
  c.textAlign='center';c.textBaseline='middle';
  for(let i=0;i<20;i++){const a0=(i-.5)*PI/10-PI/2,a1=a0+PI/10,dk=i%2==0,sc=dk?'#1d1d1b':'#efe6c8',mc=dk?'#d8352c':'#2f9a55';
    ring(R25,T0,sc,a0,a1);ring(T0,T1,mc,a0,a1);ring(T1,D0,sc,a0,a1);ring(D0,1,mc,a0,a1);
    const on=!act||act.includes(ORDER[i]);if(!on)ring(R25,1,'rgba(11,13,11,.72)',a0,a1);
    c.fillStyle=on?'#f1efe6':'#4a5248';c.font=`700 ${R*.12}px "Barlow Condensed",Impact,sans-serif`;
    const am=a0+PI/20;c.fillText(ORDER[i],Math.cos(am)*R*.92,Math.sin(am)*R*.92)}
  ring(RB,R25,'#2f9a55',0,7);ring(0,RB,'#d8352c',0,7);
  c.strokeStyle='rgba(180,180,170,.5)';c.lineWidth=1;[RB,R25,T0,T1,D0,1].forEach(r=>{c.beginPath();c.arc(0,0,r*P,0,7);c.stroke()});
  (S&&S.turn||[]).forEach((t,k)=>{if(t.x==null)return;c.beginPath();c.arc(t.x*P,t.y*P,R*.035,0,7);c.fillStyle='#fff';c.fill();c.lineWidth=3;c.strokeStyle='#121512';c.stroke();
    c.fillStyle='#121512';c.font=`700 ${R*.04}px sans-serif`;c.fillText(k+1,t.x*P,t.y*P)});
}
function hit(cv,e){
  const b=cv.getBoundingClientRect(),R=b.width/2,P=R*PLAY,x=(e.clientX-b.left-R)/P,y=(e.clientY-b.top-R)/P,r=Math.hypot(x,y);
  if(r*PLAY>1)return null;if(r>1)return{v:0,m:1,x,y};
  if(r<RB)return{v:50,m:1,x,y};if(r<R25)return{v:25,m:1,x,y};
  let a=Math.atan2(y,x)+PI/2+PI/20;a=(a%(2*PI)+2*PI)%(2*PI);
  return{v:ORDER[Math.floor(a/(PI/10))%20],m:r<T0?1:r<T1?3:r<D0?1:2,x,y};
}
const redraw=()=>{const b=$('bd');if(b)drawBoard(b)};
addEventListener('resize',redraw);try{document.fonts.ready.then(redraw)}catch(e){}

// ---------- Tableaux ----------
function crTable(){
  const sd=S.sides,sym=n=>['','/','X','⊗'][Math.min(n||0,3)],c=i=>i==S.cur&&S.winner==null?'cur':'';
  return `<div class="crt"><table><thead><tr><th></th>${sd.map((s,i)=>`<th class="${c(i)}">${esc(s.name)}</th>`).join('')}</tr></thead><tbody>
  ${S.nums.map(n=>`<tr class="${sd.every(s=>(s.marks[n]||0)>=3)?'dead':''}"><th>${n==25?'Bull':n}</th>${sd.map((s,i)=>`<td class="${c(i)}">${sym(s.marks[n])}</td>`).join('')}</tr>`).join('')}
  <tr class="pts"><th>Points</th>${sd.map((s,i)=>`<td class="${c(i)}">${s.pts}</td>`).join('')}</tr>
  <tr class="mpr"><th>Marques / tour</th>${sd.map(s=>`<td>${avg(s)}</td>`).join('')}</tr></tbody></table></div>`;
}
function x01Cards(rem){
  return `<div class="players">${S.sides.map((s,i)=>`<div class="p ${i==S.cur?'cur':''}"><div class="n">${esc(s.name)}</div>
  <div class="s">${i==S.cur?rem:s.score}</div>
  ${s.members.length>1?`<div class="m">${s.members.map(esc).join(', ')}</div>`:''}
  <div class="m">Moy. ${avg(s)} · Dernière ${s.last===''?'–':s.last}</div></div>`).join('')}</div>`;
}

// ---------- Partie ----------
function game(){
  if(S.winner!=null)return winScreen();
  const s=S.sides[S.cur],who=s.members[s.mi%s.members.length],cr=S.mode!='x01',left=3-S.turn.length;
  const sum=S.turn.reduce((a,d)=>a+d.val,0),rem=S.wait=='bust'?s.score:s.score-sum;
  const co=!cr&&S.dout?checkout(rem,left):'';
  const title=cr?(S.mode=='wild'?'Cricket Wildcard':'Cricket'):S.start+(S.dout?' · Double out':'');
  const nums=cr?S.nums.filter(n=>n<25):[...Array(20)].map((_,i)=>i+1);
  const input=cfg.input=='clavier'
    ?`<div class="pad"><button class="k mod ${mult==2?'on':''}" data-m="2">Double</button><button class="k mod ${mult==3?'on':''}" data-m="3">Triple</button>${nums.map(n=>`<button class="k" data-k="${n}">${n}</button>`).join('')}<button class="k bull" data-k="25">25</button><button class="k bull2" data-k="50">Bull</button></div>`
    :'<canvas class="board" id="bd"></canvas>';
  const vol=S.wait=='bust'?'Bust':cr?sum+(sum>1?' marques':' marque'):sum;
  app.innerHTML=`<div class="game">${input}<div class="side">
  <div class="row" style="justify-content:space-between"><h1>${title}${S.bull50?' · Bull unique':''}</h1><span class="lbl">Tour ${S.round}</span></div>
  ${cr?crTable():x01Cards(rem)}
  <div class="turn"><span class="lbl">${esc(who)}${s.members.length>1?' · '+esc(s.name):''}</span>${[0,1,2].map(i=>`<div class="dart">${S.turn[i]?S.turn[i].l:'·'}</div>`).join('')}
  ${co?`<span class="co">Finish : ${co}</span>`:''}</div>
  <div class="msg">${msg}</div>
  ${S.wait?`<button class="go" id="next">Volée : ${vol} · Joueur suivant</button>`:''}
  <div class="ctl3"><button class="k" id="miss">Raté</button><button class="k ctl" id="undo">Annuler</button><button class="k ctl" id="inp">${cfg.input=='clavier'?'Cible':'Clavier'}</button><button class="k ctl" id="menu">Menu</button></div>
  </div></div>`;
  const bd=$('bd');if(bd){drawBoard(bd);bd.onpointerdown=e=>{e.preventDefault();const h=hit(bd,e);if(h)throwDart(h.v,h.m,h.x,h.y)}}
  app.onclick=e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
    if(d.k){const v=+d.k,m=v>20?1:mult;mult=1;throwDart(v,m);game()}
    else if(d.m){mult=mult==+d.m?1:+d.m;game()}
    else if(t.id=='miss')throwDart(0,1)
    else if(t.id=='next')confirmTurn()
    else if(t.id=='undo')undo()
    else if(t.id=='inp'){cfg.input=cfg.input=='clavier'?'cible':'clavier';save();game()}
    else if(t.id=='menu')setup()
  };
}

function throwDart(v,m,x,y){
  if(S.wait||S.winner!=null)return;
  if(v==25&&S.bull50)v=50;
  if(v==0||v==25||v==50)m=1;
  hist.push(JSON.stringify(S));msg='';
  const s=S.sides[S.cur],l=v==0?'0':v==50?'Bull':v==25?'25':(m==3?'T':m==2?'D':'')+v;
  if(S.mode=='x01'){
    const val=v*m,isD=m==2||v==50;S.turn.push({val,x,y,l});
    const tot=S.turn.reduce((a,d)=>a+d.val,0),rest=s.score-tot;
    if(rest<0||(S.dout&&rest==1)||(rest==0&&S.dout&&!isD)){S.wait='bust';msg='Bust : le score reste à '+s.score}
    else if(rest==0){s.darts+=S.turn.length;s.total+=tot;s.score=0;s.last=tot;S.winner=S.cur;S.turn=[]}
    else if(S.turn.length==3)S.wait='ok';
  }else{
    const n=v==50?25:v,mk=v==50?2:v==25?1:m;let got=0;
    if(v&&S.nums.includes(n)){
      const have=s.marks[n]||0,close=Math.min(mk,3-Math.min(have,3)),extra=mk-close;
      s.marks[n]=have+close;got=close;
      if(extra>0&&S.sides.some(o=>o!==s&&(o.marks[n]||0)<3)){s.pts+=extra*(n==25?25:n);got+=extra}
    }
    S.turn.push({val:got,x,y,l});s.darts++;s.total+=got;
    if(S.nums.every(k=>(s.marks[k]||0)>=3)&&S.sides.every(o=>o===s||s.pts>=o.pts)){S.winner=S.cur;S.turn=[]}
    else if(S.turn.length==3)S.wait='ok';
  }
  save();game();
}
function confirmTurn(){
  hist.push(JSON.stringify(S));const s=S.sides[S.cur],tot=S.turn.reduce((a,d)=>a+d.val,0);
  if(S.mode=='x01'){s.darts+=S.turn.length;if(S.wait=='bust')s.last='Bust';else{s.total+=tot;s.score-=tot;s.last=tot}}
  else s.last=tot;
  s.mi++;S.wait=false;msg='';S.turn=[];S.cur=(S.cur+1)%S.sides.length;if(S.cur==0)S.round++;
  save();game();
}
function undo(){if(hist.length){S=JSON.parse(hist.pop());msg='';mult=1;save();game()}}

function winScreen(){
  const w=S.sides[S.winner],cr=S.mode!='x01';
  app.innerHTML=`<div class="win"><div class="lbl">Victoire</div><div class="big">${esc(w.name)}</div>
  ${w.members.length>1?`<div>${w.members.map(esc).join(' · ')}</div>`:''}
  <div>${w.darts} fléchettes · ${cr?avg(w)+' marques par tour':'moyenne '+avg(w)+' par volée'}</div>
  ${cr?crTable():''}
  <div class="row" style="justify-content:center"><button class="chip" id="undo">Annuler la dernière</button><button class="chip" id="again">Rejouer</button><button class="go" id="new">Nouvelle partie</button></div></div>`;
  app.onclick=e=>{const t=e.target.closest('button');if(!t)return;
    if(t.id=='new')setup();else if(t.id=='again')startGame();else if(t.id=='undo')undo()};
}

try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}
setup();
</script>
