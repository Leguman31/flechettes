name: Construire l'APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Préparer le projet Android
        run: |
          mkdir www && cp index.html manifest.json sw.js supabase.js qrcode.js icon-*.png www/
          npm init -y
          npm i @capacitor/core@6.2.0 @capacitor/cli@6.2.0 @capacitor/android@6.2.0
          npx cap init "Fléchettes" fr.maison.flechettes --web-dir www
          npx cap add android
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in android/app/src/main/res/mipmap-*; do cp icon-192.png $d/ic_launcher.png; cp icon-192.png $d/ic_launcher_round.png; done
      - name: Compiler
        run: mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore && cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Flechettes.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Fléchettes (dernière version)
          files: Flechettes.apk
          make_latest: true
      - name: Préparer le site
        run: |
          mkdir site
          cp index.html manifest.json sw.js supabase.js qrcode.js icon-*.png .htaccess Flechettes.apk site/
      - name: Mettre le site sur l'hébergement OVH
        if: ${{ env.FTP_SERVER != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./site/
          server-dir: ./flechettes/
